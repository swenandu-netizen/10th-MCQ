<!DOCTYPE html>
<html lang="mr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Boss Panel - Maha Board MCQ</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0f172a; --card-bg: #1e293b; --text-light: #f8fafc;
            --primary: #3b82f6; --success: #10b981; --warning: #f59e0b; --danger: #ef4444;
        }
        body {
            font-family: 'Poppins', sans-serif; background: var(--bg-dark); color: var(--text-light); margin: 0; padding: 15px;
        }
        .container {
            width: 100%; max-width: 500px; background: var(--card-bg); padding: 25px; border-radius: 16px; margin: 20px auto; box-shadow: 0 10px 25px rgba(0,0,0,0.5); text-align: center; box-sizing: border-box;
        }
        h2 { margin-top: 0; color: var(--primary); }
        input, textarea {
            width: 100%; padding: 14px; margin: 10px 0; border-radius: 10px; border: 1px solid #334155; background: #0f172a; color: white; font-size: 15px; box-sizing: border-box; outline: none; font-family: 'Poppins', sans-serif;
        }
        input:focus, textarea:focus { border-color: var(--primary); }
        button {
            width: 100%; padding: 14px; margin: 10px 0; border-radius: 10px; border: none; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.3s;
        }
        .btn-primary { background: var(--primary); color: white; }
        .btn-success { background: var(--success); color: white; }
        .btn-warning { background: var(--warning); color: white; }
        .btn-logout { background: var(--danger); color: white; margin-top: 20px; }
        .hidden { display: none; }
        
        .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
        .stat-box { background: #334155; padding: 15px; border-radius: 12px; text-align: center; border: 1px solid rgba(255,255,255,0.05); }
        .stat-box h3 { margin: 0; font-size: 24px; color: var(--success); }
        .stat-box p { margin: 5px 0 0 0; font-size: 12px; color: #cbd5e1; font-weight: 600; }
        
        .section { background: #0f172a; padding: 15px; border-radius: 12px; margin-bottom: 15px; text-align: left; border: 1px solid #334155; }
        .section h4 { margin: 0 0 10px 0; color: var(--text-light); font-size: 16px; }
        
        .result-box { background: #1e293b; padding: 10px; border-radius: 8px; margin-top: 10px; font-size: 14px; border: 1px dashed var(--primary); display: none; }
    </style>
</head>
<body>

<div class="container" id="loginScreen">
    <div style="font-size: 50px; margin-bottom: 10px;">🛡️</div>
    <h2>Boss Panel</h2>
    <p style="font-size: 14px; color: #94a3b8;">फक्त मालकांसाठी (Admin Only)</p>
    <input type="password" id="adminPass" placeholder="Admin Password टाका">
    <button class="btn-primary" onclick="adminLogin()">लॉगिन करा</button>
    <p id="loginMsg" style="color: var(--danger); font-size: 14px;"></p>
</div>

<div class="container hidden" id="dashboardScreen">
    <h2>👑 Control Room</h2>
    
    <!-- 📊 Stats Dashboard -->
    <div class="stat-grid">
        <div class="stat-box">
            <h3 id="totalUsers" style="color: var(--primary);">0</h3>
            <p>एकूण विद्यार्थी</p>
        </div>
        <div class="stat-box">
            <h3 id="totalVIP" style="color: var(--success);">0</h3>
            <p>VIP विद्यार्थी</p>
        </div>
        <div class="stat-box" style="grid-column: span 2; background: #451a03; border-color: #b45309;">
            <p style="color: #fcd34d;">देणे बाकी असलेले रेफरल पैसे (Pending Payout)</p>
            <h3 id="pendingPayout" style="color: #fbbf24; font-size: 28px;">₹0</h3>
        </div>
    </div>

    <!-- 🔍 1. User Search (Password Finder) -->
    <div class="section">
        <h4>🔍 विद्यार्थी शोधा (पासवर्ड / माहिती)</h4>
        <div style="display: flex; gap: 10px;">
            <input type="number" id="searchMobile" placeholder="मोबाईल नंबर" style="margin: 0; flex: 2;">
            <button class="btn-primary" onclick="searchUser()" style="margin: 0; flex: 1;">शोधा</button>
        </div>
        <div id="searchResult" class="result-box"></div>
    </div>

    <!-- 🚀 2. VIP Approval -->
    <div class="section">
        <h4>🚀 युजरला VIP करा (One-Click)</h4>
        <input type="number" id="upgradeMobile" placeholder="ज्याला VIP करायचे आहे त्याचा नंबर">
        <button class="btn-success" onclick="makeVIP()">👑 VIP ॲक्टिव्हेट करा</button>
        <p id="vipMsg" style="font-size: 13px; margin-bottom: 0; color: var(--success);"></p>
    </div>

    <!-- 💸 3. Referral Payout -->
    <div class="section">
        <h4>💸 रेफरल पेमेंट क्लिअर करा</h4>
        <input type="number" id="payoutMobile" placeholder="ज्याला पैसे पाठवले त्याचा नंबर">
        <button class="btn-warning" onclick="clearPayout()">पैसे पाठवले (Mark as Paid)</button>
        <p id="payoutMsg" style="font-size: 13px; margin-bottom: 0; color: var(--success);"></p>
    </div>

    <!-- 📢 4. Live Announcement -->
    <div class="section">
        <h4>📢 सर्वांना नोटीस पाठवा (Live Update)</h4>
        <textarea id="noticeText" rows="3" placeholder="ॲपमध्ये सर्वांना दाखवण्यासाठी नोटीस इथे लिहा..."></textarea>
        <button class="btn-primary" style="background: #8b5cf6;" onclick="updateNotice()">🚀 नोटीस लाईव्ह करा</button>
        <p id="noticeMsg" style="font-size: 13px; margin-bottom: 0; color: var(--success);"></p>
    </div>

    <button class="btn-logout" onclick="logout()">🔐 लॉग आउट करा</button>
</div>

<script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycby83CF_8FA8k86UxKHhhCpCZjjHfnn6o7nsByF9CR01RHzrVejG18SdXo-V64S0jyfVRw/exec"; // जुनीच लिंक
    
    function adminLogin() {
        let pass = document.getElementById('adminPass').value;
        let msg = document.getElementById('loginMsg');
        if(pass === "") { msg.innerText = "पासवर्ड टाका!"; return; }
        
        msg.style.color = "var(--primary)"; msg.innerText = "तपासत आहे...";
        
        fetch(`${SCRIPT_URL}?action=adminLogin&pass=${encodeURIComponent(pass)}`)
        .then(res => res.json())
        .then(data => {
            if(data.success) {
                document.getElementById('loginScreen').classList.add('hidden');
                document.getElementById('dashboardScreen').classList.remove('hidden');
                loadDashboardStats(pass);
            } else {
                msg.style.color = "var(--danger)"; msg.innerText = "चुकीचा पासवर्ड! ❌";
            }
        });
    }

    function loadDashboardStats(pass) {
        fetch(`${SCRIPT_URL}?action=adminStats&pass=${encodeURIComponent(pass)}`)
        .then(res => res.json())
        .then(data => {
            if(data.success) {
                document.getElementById('totalUsers').innerText = data.total;
                document.getElementById('totalVIP').innerText = data.vip;
                document.getElementById('pendingPayout').innerText = "₹" + data.pendingPayout;
            }
        });
    }

    function searchUser() {
        let mobile = document.getElementById('searchMobile').value;
        let pass = document.getElementById('adminPass').value;
        let resultBox = document.getElementById('searchResult');
        
        if(mobile === "") return;
        resultBox.style.display = "block"; resultBox.innerHTML = "शोधत आहे... ⏳";
        
        fetch(`${SCRIPT_URL}?action=searchUser&mobile=${encodeURIComponent(mobile)}&pass=${encodeURIComponent(pass)}`)
        .then(res => res.json())
        .then(data => {
            if(data.success) {
                let planColor = data.plan === "Paid" ? "var(--success)" : "var(--danger)";
                resultBox.innerHTML = `
                    <b>नाव:</b> ${data.name}<br>
                    <b>पासवर्ड:</b> <span style="color:var(--warning); font-weight:bold;">${data.password}</span><br>
                    <b>प्लॅन:</b> <span style="color:${planColor}; font-weight:bold;">${data.plan}</span>
                `;
            } else {
                resultBox.innerHTML = `<span style="color:var(--danger);">❌ विद्यार्थी सापडला नाही.</span>`;
            }
        });
    }

    function updateNotice() {
        let msgText = document.getElementById('noticeText').value;
        let pass = document.getElementById('adminPass').value;
        let msgBox = document.getElementById('noticeMsg');
        
        if(msgText === "") { msgBox.style.color = "var(--danger)"; msgBox.innerText = "काहीतरी टाईप करा!"; return; }
        msgBox.style.color = "var(--warning)"; msgBox.innerText = "अपडेट करत आहे...";
        
        fetch(`${SCRIPT_URL}?action=updateNotice&msg=${encodeURIComponent(msgText)}&pass=${encodeURIComponent(pass)}`)
        .then(res => res.json())
        .then(data => {
            if(data.success) {
                msgBox.style.color = "var(--success)"; msgBox.innerText = "✅ नोटीस सर्व ॲप्सवर लाईव्ह झाली!";
                document.getElementById('noticeText').value = "";
            }
        });
    }

    function makeVIP() {
        let mobile = document.getElementById('upgradeMobile').value;
        let pass = document.getElementById('adminPass').value;
        let msg = document.getElementById('vipMsg');
        if(mobile === "") { msg.style.color = "var(--danger)"; msg.innerText = "नंबर टाका!"; return; }
        
        msg.style.color = "var(--warning)"; msg.innerText = "VIP करत आहे...";
        
        fetch(`${SCRIPT_URL}?action=makeVIP&mobile=${encodeURIComponent(mobile)}&pass=${encodeURIComponent(pass)}`)
        .then(res => res.json())
        .then(data => {
            if(data.success) {
                msg.style.color = "var(--success)"; msg.innerText = "✅ अकाउंट VIP झाले!";
                document.getElementById('upgradeMobile').value = "";
                loadDashboardStats(pass); // रिफ्रेश डॅशबोर्ड
            } else { msg.style.color = "var(--danger)"; msg.innerText = data.message; }
        });
    }

    function clearPayout() {
        let mobile = document.getElementById('payoutMobile').value;
        let pass = document.getElementById('adminPass').value;
        let msg = document.getElementById('payoutMsg');
        if(mobile === "") return;
        
        msg.style.color = "var(--warning)"; msg.innerText = "अपडेट करत आहे...";
        fetch(`${SCRIPT_URL}?action=clearPayout&mobile=${encodeURIComponent(mobile)}&pass=${encodeURIComponent(pass)}`)
        .then(res => res.json())
        .then(data => {
            if(data.success) {
                msg.style.color = "var(--success)"; msg.innerText = "✅ पेमेंट क्लिअर झाले!";
                document.getElementById('payoutMobile').value = "";
                loadDashboardStats(pass); // रिफ्रेश पेंडिंग अमाऊंट
            } else { msg.style.color = "var(--danger)"; msg.innerText = data.message; }
        });
    }

    function logout() {
        document.getElementById('adminPass').value = "";
        document.getElementById('dashboardScreen').classList.add('hidden');
        document.getElementById('loginScreen').classList.remove('hidden');
    }
</script>
</body>
</html>
